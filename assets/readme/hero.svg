<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="el-title el-desc">
  <title id="el-title">Ellectric — AI + 电力交易技术学习平台</title>
  <desc id="el-desc">左侧为项目名与一句话介绍：从公开电力数据接入到 AI 预测、强化学习交易与可视化展示的端到端学习闭环。右侧为一张山东电力现货 15 分钟出清价格曲线示意：黄色实线为历史价格并标注晚高峰尖峰，蓝色虚线与阴影带为次日预测区间。</desc>

  <rect width="1200" height="380" rx="26" fill="#0e1116"/>

  <!-- ===== 左：标题块 ===== -->
  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" letter-spacing="1.5" fill="#fdd535">DATA → FORECAST → RL TRADING → SHOWCASE</text>

    <!-- 闪电 + 标题 -->
    <g transform="translate(0 118) scale(1.9)">
      <path d="M 12 2 L 3.5 14.5 L 9 14.5 L 7.5 24 L 17.5 10.5 L 11.5 10.5 Z" fill="#fdd535"/>
    </g>
    <text x="58" y="176" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
          font-size="56" font-weight="800" fill="#e9edf3">Ellectric</text>

    <text x="0" y="226" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
          font-size="23" fill="#c3cbd6">AI + 电力交易技术学习平台——从公开电力数据接入，</text>
    <text x="0" y="258" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
          font-size="23" fill="#c3cbd6">到预测、强化学习交易、可视化展示的端到端闭环。</text>

    <text x="0" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" fill="#97a1af">山东 15min 真实出清数据 · 745 天 × 96 点</text>
    <text x="0" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" fill="#97a1af">XGBoost / LEAR / PPO·SAC·TD3 · el-forecast.asia</text>
  </g>

  <!-- ===== 右：电价曲线卡 ===== -->
  <g id="price-chart">
    <rect x="648" y="48" width="488" height="284" rx="10" fill="#1a1f27" stroke="#2c333d"/>
    <text x="672" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" fill="#97a1af">shandong · spot clear price · 15min</text>
    <circle cx="1104" cy="75" r="5" fill="#fdd535"/>
    <text x="1092" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#fdd535" text-anchor="end">live</text>

    <!-- 网格 -->
    <g stroke="#2c333d" stroke-width="1">
      <line x1="672" y1="130" x2="1112" y2="130"/>
      <line x1="672" y1="180" x2="1112" y2="180"/>
      <line x1="672" y1="230" x2="1112" y2="230"/>
      <line x1="672" y1="280" x2="1112" y2="280"/>
    </g>

    <!-- 预测带（蓝阴影） -->
    <path d="M 920 190 C 950 178, 980 200, 1010 192 C 1040 184, 1070 202, 1100 190
             L 1100 236 C 1070 248, 1040 230, 1010 238 C 980 246, 950 224, 920 236 Z"
          fill="#4a9eff" opacity="0.12"/>

    <!-- 历史曲线（黄实线） -->
    <path d="M 672 246 C 700 238, 716 214, 744 220 C 772 226, 788 252, 816 244
             C 844 236, 858 190, 886 196 C 900 199, 908 216, 920 212"
          stroke="#fdd535" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- 预测曲线（蓝虚线） -->
    <path d="M 920 212 C 950 202, 980 222, 1010 214 C 1040 206, 1070 224, 1100 212"
          stroke="#4a9eff" stroke-width="2.5" fill="none" stroke-dasharray="6 5" stroke-linecap="round"/>

    <!-- 晚高峰尖峰标记 -->
    <circle cx="886" cy="196" r="4.5" fill="#fdd535"/>
    <rect x="838" y="158" width="96" height="24" rx="6" fill="#fdd535" opacity="0.15"/>
    <text x="886" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="14" fill="#fdd535" text-anchor="middle">peak ¥1.24</text>

    <!-- 预测起点竖线 -->
    <line x1="920" y1="120" x2="920" y2="280" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6"/>
    <text x="928" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#4a9eff">forecast</text>

    <!-- 时间轴 -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#97a1af" text-anchor="middle">
      <text x="672" y="308">00:00</text>
      <text x="786" y="308">06:00</text>
      <text x="900" y="308">12:00</text>
      <text x="1014" y="308">18:00</text>
      <text x="1104" y="308">24:00</text>
    </g>
    <line x1="672" y1="288" x2="1112" y2="288" stroke="#2c333d" stroke-width="1.5"/>
  </g>
</svg>
